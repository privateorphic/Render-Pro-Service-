<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" fill="none">
  <!-- RENDER PRO SERVICES Vector Logo for Light Backgrounds -->
  <g transform="translate(10, 10)">
    <!-- Stylized R Icon (Left) -->
    <path d="M 10 20 L 50 20 C 85 20 110 35 110 65 C 110 90 90 105 60 108 L 115 150 L 85 150 L 38 112 L 38 150 L 10 150 Z M 38 42 L 38 90 L 55 90 C 72 90 82 82 82 66 C 82 50 72 42 55 42 Z" fill="#0f3475"/>
    <!-- 4 Window Panes in R bottom left -->
    <rect x="22" y="118" width="6" height="6" fill="#6c9ae4"/>
    <rect x="30" y="118" width="6" height="6" fill="#6c9ae4"/>
    <rect x="22" y="126" width="6" height="6" fill="#6c9ae4"/>
    <rect x="30" y="126" width="6" height="6" fill="#6c9ae4"/>
  </g>

  <g transform="translate(145, 10)">
    <!-- Roof Peak -->
    <path d="M 40 45 L 140 10 L 240 45" stroke="#0f3475" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <path d="M 195 24 L 195 14 L 210 14 L 210 29" stroke="#0f3475" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    
    <!-- 4 Window Panes under Roof -->
    <rect x="132" y="26" width="7" height="7" fill="#6c9ae4"/>
    <rect x="141" y="26" width="7" height="7" fill="#6c9ae4"/>
    <rect x="132" y="35" width="7" height="7" fill="#6c9ae4"/>
    <rect x="141" y="35" width="7" height="7" fill="#6c9ae4"/>

    <!-- Text RENDER -->
    <text x="0" y="98" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="#0f3475" letter-spacing="4">RENDER</text>
    
    <!-- Text PRO SERVICES -->
    <text x="2" y="142" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="800" font-size="30" fill="#b68735" letter-spacing="9">PRO SERVICES</text>
  </g>
</svg>
